 class="hint">Los datos se guardan en este navegador. Para no perderlos, evita borrar los datos del sitio.</p></section><section class="panel"><div class="calendarhead"><div class="nav"><button id="prev" aria-label="Anterior">‹</button><strong id="period"></strong><button id="next" aria-label="Siguiente">›</button><button id="goToday">Hoy</button></div><div class="views"><button data-view="day">Día</button><button data-view="month">Mes</button><button data-view="year">Año</button></div></div><div id="calendar"></div></section></div></main><div class="modalback" id="overlay"><form class="modal" id="editor"><h2 id="modalTitle">Nuevo pendiente</h2><label class="field">Atleta<select id="athleteSelect" required></select></label><label class="field">Título<input id="taskTitle" required maxlength="160" placeholder="Pendiente o evento"></label><label class="field">Tipo<select id="taskType"><option value="task">Pendiente (fecha límite)</option><option value="event">Evento (fecha y horario)</option></select></label><label class="field">Fecha<input id="taskDate" type="date" required></label><label class="field" id="timeField">Horario<input id="taskTime" type="time"></label><label class="field">Notas<textarea id="taskNotes" rows="3"></textarea></label><div class="modalfooter"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Guardar</button></div></form></div><script>
const KEY='atletasmx-agenda-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.athletes)||!Array.isArray(state.tasks))state={athletes:[],tasks:[]};const $=id=>document.getElementById(id),today=new Date(),todayKey=localDate(today);let cursor=new Date(today.getFullYear(),today.getMonth(),today.getDate()),view='month',editing=null;const months=new Intl.DateTimeFormat('es-MX',{month:'long',year:'numeric'}),fmt=new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'long',year:'numeric'});function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function button(text,fn,cls='mini'){const b=el('button',cls,text);b.type='button';b.onclick=fn;return b}function render(){renderAthletes();renderCalendar()}function renderAthletes(){const root=$('athletes');root.replaceChildren();if(!state.athletes.length)root.append(el('p','empty','Agrega tu primer atleta para comenzar.'));state.athletes.forEach(a=>{const card=el('div','athlete'),top=el('div','athlete-top');top.append(button(a.name,()=>{const name=prompt('Nombre del atleta:',a.name);if(name&&name.trim()){a.name=name.trim();save()}},'athlete-name'),button('+ Tarea',()=>openEditor(null,a.id)),button('×',()=>{if(confirm(`¿Eliminar a ${a.name} y todos sus pendientes?`)){state.athletes=state.athletes.filter(x=>x.id!==a.id);state.tasks=state.tasks.filter(t=>t.athleteId!==a.id);save()}}));card.append(top);const tasks=state.tasks.filter(t=>t.athleteId===a.id).sort((x,y)=>x.date.localeCompare(y.date)||String(x.time||'').localeCompare(String(y.time||'')));if(!tasks.length)card.append(el('p','empty','Sin pendientes todavía.'));tasks.forEach(t=>{const item=el('div','todo'),check=el('input');check.type='checkbox';check.checked=!!t.done;check.setAttribute('aria-label','Completar '+t.title);check.onchange=()=>{t.done=check.checked;save()};const main=el('div','todo-main');main.append(el('div','todo-title'+(t.done?' done':''),t.title),el('div','meta',`${t.type==='event'?'Evento':'Límite'} · ${t.date}${t.time?' · '+t.time:''}`));const actions=el('div','todo-actions');actions.append(button('✎',()=>openEditor(t.id),'mini'),button('×',()=>{if(confirm('¿Eliminar este pendiente?')){state.tasks=state.tasks.filter(x=>x.id!==t.id);save()}},'mini'));item.append(check,main,actions);card.append(item)});root.append(card)})}function eventNode(t){const a=state.athletes.find(x=>x.id===t.athleteId),n=el('div','event'+(t.date<todayKey&&!t.done?' overdue':''),`${t.time?t.time+' · ':''}${a?a.name+': ':''}${t.title}${t.done?' ✓':''}`);n.title='Editar';n.onclick=e=>{e.stopPropagation();openEditor(t.id)};return n}function renderCalendar(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',b.dataset.view===view)});const root=$('calendar');root.replaceChildren();$('period').textContent=view==='day'?fmt.format(cursor):view==='month'?months.format(cursor):String(cursor.getFullYear());if(view==='month'){const weekdays=el('div','weekdays');['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(x=>weekdays.append(el('div','',x)));root.append(weekdays);const grid=el('div','month'),start=new Date(cursor.getFullYear(),cursor.getMonth(),1),offset=(start.getDay()+6)%7;for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),i-offset+1),key=localDate(d),cell=el('div','daycell'+(d.getMonth()!==cursor.getMonth()?' muted':'')+(key===todayKey?' current':''));cell.append(el('span','daynum',String(d.getDate())));cell.onclick=()=>{cursor=d;view='day';renderCalendar()};state.tasks.filter(t=>t.date===key).slice(0,4).forEach(t=>cell.append(eventNode(t)));const count=state.tasks.filter(t=>t.date===key).length;if(count>4)cell.append(el('div','meta',`+${count-4} más`));grid.append(cell)}root.append(grid)}else if(view==='day'){const area=el('div','dayagenda'),tasks=state.tasks.filter(t=>t.date===localDate(cursor)).sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));area.append(button('+ Agregar pendiente',()=>openEditor(null,null,localDate(cursor)),'primary'));if(!tasks.length)area.append(el('p','empty','No hay pendientes para este día.'));tasks.forEach(t=>area.append(eventNode(t)));root.append(area)}else{const grid=el('div','yeargrid');for(let m=0;m<12;m++){const d=new Date(cursor.getFullYear(),m,1),card=el('button','yearmonth');card.append(el('strong','',new Intl.DateTimeFormat('es-MX',{month:'long'}).format(d)),el('small','',`${state.tasks.filter(t=>t.date.startsWith(localDate(d).slice(0,7))).length} pendientes`));card.onclick=()=>{cursor=d;view='month';renderCalendar()};grid.append(card)}root.append(grid)}}function openEditor(id=null,athleteId=null,date=null){if(!state.athletes.length){alert('Primero agrega un atleta.');return}editing=id;const t=state.tasks.find(x=>x.id===id);$('modalTitle').textContent=t?'Editar pendiente':'Nuevo pendiente';$('athleteSelect').replaceChildren();state.athletes.forEach(a=>{const o=el('option','',a.name);o.value=a.id;$('athleteSelect').append(o)});$('athleteSelect').value=t?.athleteId||athleteId||state.athletes[0].id;$('taskTitle').value=t?.title||'';$('taskType').value=t?.type||'task';$('taskDate').value=t?.date||date||todayKey;$('taskTime').value=t?.time||'';$('taskNotes').value=t?.notes||'';toggleTime();$('overlay').classList.add('open');$('taskTitle').focus()}function toggleTime(){$('timeField').style.display=$('taskType').value==='event'?'block':'none'}$('taskType').onchange=toggleTime;$('editor').onsubmit=e=>{e.preventDefault();const task={id:editing||uid(),athleteId:$('athleteSelect').value,title:$('taskTitle').value.trim(),type:$('taskType').value,date:$('taskDate').value,time:$('taskType').value==='event'?$('taskTime').value:'',notes:$('taskNotes').value,done:state.tasks.find(t=>t.id===editing)?.done||false};if(!task.title)return;if(editing)state.tasks=state.tasks.map(t=>t.id===editing?task:t);else state.tasks.push(task);$('overlay').classList.remove('open');save()};$('cancel').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};$('addAthlete').onclick=()=>{const name=prompt('Nombre del atleta:');if(name&&name.trim()){state.athletes.push({id:uid(),name:name.trim()});save()}};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);function move(n){if(view==='day')cursor.setDate(cursor.getDate()+n);else if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);else cursor=new Date(cursor.getFullYear()+n,0,1);renderCalendar()}$('goToday').onclick=()=>{cursor=new Date(today);renderCalendar()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;renderCalendar()});$('today').textContent=new Intl.DateTimeFormat('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(today);$('monthleft').textContent=new Date(today.getFullYear(),today.getMonth()+1,0).getDate()-today.getDate();$('yearleft').textContent=Math.round((new Date(today.getFullYear()+1,0,1)-new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000)-1;render();
